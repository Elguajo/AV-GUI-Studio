name: CI

# The quality gate for every push to main and every pull request, on Windows (the product's
# target). It runs the steps of `cargo xtask ci` that cover the shipped editor: rustfmt, Clippy
# with warnings denied, the workspace tests, and the layer, asset and docs checks. The web and
# plugin builds (`cargo xtask wasm`) are not part of this gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust version comes from rust-toolchain.toml, as in local builds; every other source,
# craft-fonts included, is in vendor/ or on crates.io. Locally the toolchain is the windows-gnu host
# with the MinGW in .tools/; CI uses the runner's default MSVC host, which needs no MinGW.
env:
  CRAFT_FONTS_REQUIRED: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  lint:
    name: lint (fmt, clippy, layers, assets, docs)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings
      - name: Layer rules
        run: cargo xtask layers
      - name: Asset attribution
        run: cargo xtask assets
      - name: Docs links
        run: cargo xtask docs

  test:
    name: test (workspace)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit and integration tests
        run: cargo test --locked --workspace --lib --bins --tests
      - name: Doc tests
        run: cargo test --locked --workspace --doc
