# Project MCP servers for Codex. Codex loads this file only for a trusted project.
# Build the CLI first: cargo build --locked --release -p figcraft-cli

# Headless AV GUI Studio session: no window, one untitled document.
[mcp_servers.av-gui-studio]
command = "target/release/av-gui-studio-cli"
args = ["mcp"]

# Drives the running app. Start it with: av-gui-studio --control 7979
[mcp_servers.av-gui-studio-app]
command = "target/release/av-gui-studio-cli"
args = ["mcp", "--attach", "7979"]
